name: Release CLI and offline viewer

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version and prerelease metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: node publishing/release/version.mjs "$RELEASE_TAG" "$PRERELEASE"
      - run: npm run check
      - run: npm test
      - name: Pack and smoke-test release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run release:pack -- "$RELEASE_TAG"
      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/releases/* --clobber
